<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ekroz Ethiopia Tender</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
<header class="bg-emerald-700 text-white p-6">
  <h1 class="text-2xl font-bold">Ekroz Ethiopia Tender</h1>
  <p class="text-emerald-100 text-sm">Free Ethiopian tender listings</p>
  <input id="search" oninput="showTenders()" placeholder="Search tenders..." class="mt-3 p-2 rounded w-full sm:w-80 text-slate-900">
</header>

<main class="p-4 max-w-4xl mx-auto">
  <div id="tenderList" class="grid gap-3"></div>
</main>

<footer class="bg-slate-900 text-slate-300 p-6 mt-8 text-sm">
  Ekroz Ethiopia Tender links to official public tender sources.
</footer>

<script>
const tenders = [
  {
    title: "Procurement of Medical Equipment and Supplies",
    buyer: "Hospital",
    source: "Ethiopia eGP",
    url: "https://production.egp.gov.et/egp/bids/all",
    category: "Medical Equipment",
    region: "Addis Ababa",
    deadline: "2026-11-15"
  },
  {
    title: "Procurement of Construction Materials",
    buyer: "Ethiopian Federal Police",
    source: "Ethiopia eGP",
    url: "https://production.egp.gov.et/egp/bids/all",
    category: "Construction Materials",
    region: "Addis Ababa",
    deadline: "2026-11-20"
  },
  {
    title: "Supply of Office Furniture",
    buyer: "Public Organization",
    source: "FreeTender",
    url: "https://freetender.net/tenders/ethiopia",
    category: "Office Furniture",
    region: "Oromia",
    deadline: "2026-11-10"
  },
  {
    title: "Vehicle Spare Parts Supply",
    buyer: "Regional Transport Bureau",
    source: "Bina",
    url: "https://bina.et/tenders",
    category: "Vehicle Spare Parts",
    region: "Amhara",
    deadline: "2026-11-18"
  }
];

function showTenders() {
  const search = document.getElementById("search").value.toLowerCase();
  const list = document.getElementById("tenderList");

  const results = tenders.filter(t =>
    (t.title + t.buyer + t.category + t.source + t.region)
      .toLowerCase()
      .includes(search)
  );

  list.innerHTML = results.map(t => `
    <div class="bg-white p-4 rounded-lg border">
      <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded">${t.category}</span>
      <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded">${t.source}</span>
      <h2 class="font-semibold mt-2">${t.title}</h2>
      <p class="text-sm text-slate-600">${t.buyer} • ${t.region} • Deadline: ${t.deadline}</p>
      <a href="${t.url}" target="_blank" class="text-emerald-700 font-semibold">View official notice →</a>
    </div>
  `).join("");
}

showTenders();
</script>
</body>
</html>
